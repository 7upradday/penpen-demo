function arrive(){if(['opening','closing','loading'].includes(state))return;stopReveal();stopFloat();fromArchive=false;archiveVisible(false);resetEnvelope();['letter','postage','sticker','ticket','close','closeNote','readingHint'].forEach(id=>hide($('#'+id)));$('#letter').setAttribute('aria-hidden','true');show($('#openCta'));show($('#postmark'));show($('#readyNote'));$('#close').disabled=true;setTitle('你收到一封来信','有位老朋友，想把今天的小事说给你听。',0);setState('arrival');if(!reduced)floatAnim=$('#envelope').animate([{transform:'translateY(0) rotate(-2deg)'},{transform:'translateY(-9px) rotate(-1deg)'},{transform:'translateY(0) rotate(-2deg)'}],{duration:4200,iterations:Infinity,easing:'ease-in-out'});$('#openBtn').focus({preventScroll:true})}
async function openLetter(){if(!['arrival','archive'].includes(state))return;fromArchive=state==='archive';setState('opening');stopFloat();stopReveal();resetEnvelope();$('#envelope').style.pointerEvents='none';$('#envelope').tabIndex=-1;$('#envelope').setAttribute('aria-disabled','true');if(fromArchive){animate($('#archive'),[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(90px)'}],650).then(()=>{archiveVisible(false);$('#archive').style.transform='none'})}setTitle('一封信，慢慢读',`来自${names[current]}朋友 · ${months[current]}月`,1);['openCta','postmark','readyNote'].forEach(id=>animate($('#'+id),[{opacity:1},{opacity:0}],200).then(()=>hide($('#'+id))));
await animate($('#seal'),[{transform:'scale(1)',opacity:1},{transform:'scale(1.12) translateY(-8px)',opacity:1},{transform:'scale(.65) translateY(-32px)',opacity:0}],330);hide($('#seal'));
await animate($('#flap'),[{transform:'rotateX(0deg)'},{transform:'rotateX(-178deg)'}],650,'cubic-bezier(.45,0,.2,1)');$('#flap').style.zIndex=1;
const l=$('#letter');show(l);l.setAttribute('aria-hidden','false');l.style.transform='translateY(230px) scale(.74)';l.style.opacity=0;
const ep=animate($('#envelope'),[{transform:'none',opacity:1},{transform:'translateY(120px) scale(.88)',opacity:.45}],850);
const lp=animate(l,[{transform:'translateY(230px) scale(.74)',opacity:0},{transform:'translateY(-13px) scale(1.018)',opacity:1,offset:.78},{transform:'none',opacity:1}],1100);
const extras=[['postage','rotate(7deg)',0],['ticket','rotate(-12deg)',130],['sticker','rotate(-11deg)',220]].map(([id,end,delay])=>{const el=$('#'+id);show(el);return animate(el,[{transform:'translateY(260px) scale(.35) rotate(0deg)',opacity:0},{transform:end+' translateY(-12px) scale(1.06)',opacity:1,offset:.8},{transform:end,opacity:1}],920,'cubic-bezier(.16,1,.3,1)',delay)});
await Promise.all([ep,lp,...extras]);setState('reading');$('#close').disabled=false;['close','closeNote','readingHint'].forEach(id=>{show($('#'+id));animate($('#'+id),[{opacity:0},{opacity:1}],300)});reveal=$$('.line').map((el,i)=>el.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:reduced?1:650,delay:reduced?0:i*170,fill:'forwards',easing:'ease-out'}));$('#close').focus({preventScroll:true})}
async function closeLetter(){if(state!=='reading')return;setState('closing');$('#close').disabled=true;stopReveal();['close','closeNote','readingHint'].forEach(id=>hide($('#'+id)));setTitle('把这份温柔，收起来','读过的日子，会在这里好好保存。',2);$('#letter').setAttribute('aria-hidden','true');
const ret=$$('.line').map(el=>{el.style.opacity=0});const pack=['postage','sticker','ticket'].map((id,i)=>animate($('#'+id),[{opacity:1,transform:getComputedStyle($('#'+id)).transform},{opacity:0,transform:'translateY(240px) scale(.4) rotate(0deg)'}],470,'cubic-bezier(.5,0,.7,.3)',i*45).then(()=>hide($('#'+id))));
await Promise.all([...pack,animate($('#letter'),[{transform:'none',opacity:1},{transform:'translateY(230px) scale(.74)',opacity:0}],670,'cubic-bezier(.45,0,.55,1)'),animate($('#envelope'),[{transform:'translateY(120px) scale(.88)',opacity:.45},{transform:'none',opacity:1}],670)]);hide($('#letter'));$('#flap').style.zIndex=7;
archiveVisible(true);$('#archive').inert=true;$('#archive').style.pointerEvents='none';animate($('#archive'),[{transform:'translateY(180px)',opacity:0},{transform:'none',opacity:1}],1100);$('#archiveCard').style.opacity=0;
await animate($('#flap'),[{transform:'rotateX(-178deg)'},{transform:'rotateX(0deg)'}],530,'cubic-bezier(.45,0,.2,1)');show($('#seal'));await animate($('#seal'),[{transform:'scale(.65)',opacity:0},{transform:'scale(1.05)',opacity:1,offset:.75},{transform:'none',opacity:1}],260);
$('#envelope').style.zIndex=50;const mobile=innerWidth<=680;await animate($('#envelope'),[{transform:'none',opacity:1},{transform:`translateY(${mobile?60:90}px) scale(.55) rotate(-5deg)`,opacity:1,offset:.45},{transform:`translateY(${mobile?268:310}px) scale(.37) rotate(0deg)`,opacity:0}],1150,'cubic-bezier(.45,0,.25,1)');hide($('#envelope'));saved.add(current);try{localStorage.setItem('penpen-demo-saved',JSON.stringify([...saved]))}catch{}updateMonth();showArchive();showToast(`已收进${months[current]}月信盒`)}
function showArchive(){stopFloat();archiveVisible(true);$('#archive').style.pointerEvents='auto';$('#archive').style.transform='none';show($('#archiveCard'));hide($('#envelope'));['openCta','readyNote','postmark','letter','postage','sticker','ticket','close','closeNote','readingHint'].forEach(id=>hide($('#'+id)));$('#letter').setAttribute('aria-hidden','true');setState('archive');setTitle('我的信盒','按月份，收藏每一封来信。',2);updateMonth();$$('.month-tab')[current].focus({preventScroll:true})}
function showToast(t){clearTimeout(toastTimer);const el=$('#toast');el.textContent=t;animate(el,[{opacity:0,transform:'translate(-50%,20px)'},{opacity:1,transform:'translate(-50%,0)'}],300);toastTimer=setTimeout(()=>animate(el,[{opacity:1},{opacity:0}],300),2400)}
for(let i=0;i<12;i++){const div=document.createElement('div');div.className='divider kraft';div.style.top=(205+i*18)+'px';div.style.zIndex=i+1;const tab=document.createElement('button');tab.className='month-tab';tab.setAttribute('role','tab');tab.setAttribute('aria-label',`${months[i]}月`);tab.style.setProperty('--tab-left',`${[8,39,69][i%3]}%`);tab.innerHTML=`${mon[i]}<span class="dot"></span>`;tab.onclick=()=>{if(state!=='archive')return;current=i;updateMonth();animate($('#archiveCard'),[{transform:'translateY(10px) rotate(-2deg)',opacity:.4},{transform:'rotate(-2deg)',opacity:1}],350)};tab.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();current=e.key==='Home'?0:e.key==='End'?11:(i+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1)+12)%12;updateMonth();$$('.month-tab')[current].focus()}};div.append(tab);$('#dividers').append(div)}
$('#openBtn').onclick=openLetter;$('#envelope').onclick=openLetter;$('#envelope').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter()}};$('#close').onclick=closeLetter;$('#archiveCard').onclick=openLetter;$('#restart').onclick=()=>{if(state==='reading')return closeLetter();arrive()};$('#navArchive').onclick=()=>{if(state==='reading')closeLetter();else if(state==='arrival')showArchive()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state==='reading')closeLetter()});
async function init(){updateMonth();await Promise.all([document.fonts.ready,...Object.values(ASSETS).flat().map(src=>new Promise(resolve=>{const im=new Image();im.onload=im.onerror=resolve;im.src=src}))]);$('#openBtn').disabled=false;setState('arrival');arrive();window.penpenReady=true;parent.postMessage({type:"penpen-ready"},location.origin)}init();
window.penpenDemo={getState:()=>state,getMonth:()=>current,getSaved:()=>[...saved],open:openLetter,close:closeLetter};

let bridgeRequest=null;
function bridgeStart(){if(!window.penpenReady||!bridgeRequest)return;fit();const action=bridgeRequest;bridgeRequest=null;if(['opening','closing'].includes(state))return;current=4;updateMonth();if(action==='archive'){showArchive();return}arrive();requestAnimationFrame(()=>openLetter())}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(['penpen-open','penpen-archive'].includes(e.data?.type)){bridgeRequest=e.data.type==='penpen-open'?'open':'archive';bridgeStart()}});
document.querySelector('#return-mailbox').onclick=()=>parent.postMessage({type:'penpen-home'},location.origin);
const readyCheck=setInterval(()=>{if(window.penpenReady){clearInterval(readyCheck);bridgeStart()}},100);
</script></body></html>
